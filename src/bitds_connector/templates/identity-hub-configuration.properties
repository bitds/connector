edc.hostname=identityhub
# Health (/api/check/*)
web.http.port=7080
web.http.path=/api
# Identity API: manage participants, keys and credentials (x-api-key)
web.http.identity.port=7081
web.http.identity.path=/api/identity
# Credential Service (DCP): other connectors ask here for presentations
web.http.credentials.port=7082
web.http.credentials.path=/api/credentials
# DID Service: publishes the did.json documents
web.http.did.port=7083
web.http.did.path=/
# STS: the connector gets its DCP tokens here
web.http.sts.port=7084
web.http.sts.path=/api/sts

# did:web over HTTP
edc.iam.did.web.use.https=false
# Reject reused tokens (replay)
edc.iam.accesstoken.jti.validation=true

# Participant data is encrypted with the AES key stored in the vault under this alias.
# AesKeySeedExtension creates it at startup if it is missing.
edc.encryption.aes.key.alias=bitds-aes-key

# Super-user (SuperUserSeedExtension): base64("super-user") + "." + secret.
# Header for the Identity API: x-api-key: <this value>
edc.ih.api.superuser.key=changeme

# PostgreSQL
edc.datasource.default.name=default
edc.datasource.default.url=jdbc:postgresql://db:5432/identityhub
edc.datasource.default.user=postgres
edc.datasource.default.password=postgres
edc.sql.schema.autocreate=true

# Vault: AES key, private keys and STS secrets
edc.vault.hashicorp.url=http://vault:8200
edc.vault.hashicorp.api.secret.path=/v1/secret
edc.vault.hashicorp.health.check.enabled=false
edc.vault.hashicorp.token=changeme
