edc.participant.id=did:web:identityhub%3A7083:provider-base
edc.participant.context.id=provider-base
edc.hostname=localhost
edc.dsp.callback.address=http://localhost:19194/protocol
web.http.port=19191
web.http.path=/api

web.http.management.port=19193
web.http.management.path=/management
web.http.management.auth.type=tokenbased
web.http.management.auth.key=managementApiKeyProviderBase
web.http.management.auth.context=management-api

web.http.protocol.port=19194
web.http.protocol.path=/protocol
edc.transfer.proxy.token.signer.privatekey.alias=private-key
edc.transfer.proxy.token.verifier.publickey.alias=public-key

# EDR token keys (Ed25519), created by key-init
edc.participant.private.key=/identity/ed25519_private.pem
edc.participant.public.key=/identity/ed25519_public.pem

web.http.public.port=19291
web.http.public.path=/public
web.http.control.port=19192
web.http.control.path=/control
web.http.version.port=19195
web.http.version.path=/version
edc.dataplane.api.public.baseurl=http://localhost:19291/public
edc.dataplane.proxy.public.endpoint=http://localhost:19291/public

# data plane signaling
web.http.signaling.port=19197

# schema validation
org.bitds.edc.connector.validation.asset.schema.path=asset-schema-dcat.json

# configuration PostgreSQL DB
edc.datasource.default.name=default
edc.datasource.default.user=postgres
edc.datasource.default.password=postgres
edc.datasource.default.url=jdbc:postgresql://db:5432/edc_provider_base
edc.sql.schema.autocreate=true

# Service Provider
org.bitds.edc.service.dataservice.credentials.default={\"description\": \"Default. Please check the documentation in the homepage\", \"url\": \"https://myservice.com/mydashboard\", \"user\": \"customer\", \"password\": \"defaultpass\"}

# DCP
edc.iam.did.web.use.https=false
edc.iam.accesstoken.jti.validation=true

# STS of the IdentityHub of this deployment
edc.iam.sts.oauth.token.url=http://identityhub:7084/api/sts/token
edc.iam.sts.oauth.client.id=did:web:identityhub%3A7083:provider-base
edc.iam.sts.oauth.client.secret.alias=provider-base-sts-client-secret
# Filled in by `connector up` when it registers the participant in the IdentityHub.
bitds.sts.client.secret=

# Default Scope
edc.iam.dcp.scopes.membership.id=membership
edc.iam.dcp.scopes.membership.type=DEFAULT
edc.iam.dcp.scopes.membership.value=org.eclipse.dspace.dcp.vc.type:MembershipCredential:read

# Trusted issuer
edc.iam.trustedissuer.issuerservice.id=did:web:localhost%3A7183:issuer
edc.iam.trustedissuer.issuerservice.supportedtypes=["MembershipCredential"]

# Revocation: seconds the issuer's revocation list is cached
edc.iam.credential.revocation.cache.validity=900
