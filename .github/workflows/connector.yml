name: Connector package

# El .pyz no se versiona: se construye aqui. En cada push que toque el codigo
# o el build se comprueba que sigue construyendo y funcionando, y al publicar
# una release con tag vX.Y.Z se adjunta el binario junto a su SHA-256.
on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - main
    paths:
      - '.github/workflows/connector.yml'
      - 'build.sh'
      - 'src/**'
      - 'tests/**'
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: connector-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and smoke test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # El minimo que promete el README y la ultima estable: el zipapp no
        # lleva interprete, asi que corre con el Python que haya en el servidor.
        python: ['3.10', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      # Un tag mal escrito (v.0.0.1, 1.2.0...) debe romper la release de forma
      # visible, no publicarla sin binario o con una version absurda dentro.
      - name: Check release tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || {
            echo "::error::Release tag '$TAG' is not vX.Y.Z (e.g. v1.2.0 or v1.2.0-rc1)"
            exit 1
          }

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      # En una release, el tag se sella aqui y no en `publish`: el .pyz que se
      # sube es este mismo, el que pasa el smoke test. Fuera de una release el
      # tag va vacio y build.sh cae a su version de desarrollo.
      - name: Build
        env:
          CONNECTOR_VERSION: ${{ github.event.release.tag_name }}
        run: ./build.sh

      - name: Verify checksum
        run: cd dist && sha256sum -c connector.pyz.sha256

      - name: Smoke test
        env:
          PYZ: ${{ github.workspace }}/dist/connector.pyz
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -eu
          "$PYZ" --help > /dev/null
          "$PYZ" generate --list-countries > /dev/null

          # En una release, el binario tiene que decir de que release salio.
          version="$("$PYZ" --version)"
          if [ -n "$TAG" ]; then
            test "$version" = "connector ${TAG#v}"
          fi

          # Un despliegue de verdad en un directorio vacio: valida tambien las
          # plantillas, que es donde un cambio rompe sin que el import falle.
          cd "$(mktemp -d)"
          "$PYZ" generate --participant-id ci-smoke --host 203.0.113.10 \
                          --country esp --entity-type public \
                          --registry-url https://registry.example.org/api/ --force
          test -f docker-compose.yml
          test -f claims.json
          test "$(stat -c '%a' provider_config_secret.properties)" = 600
          docker compose config -q
          "$PYZ" info > /dev/null

      - name: Upload artifact
        if: matrix.python == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: connector-pyz
          path: |
            dist/connector.pyz
            dist/connector.pyz.sha256
          retention-days: 14

  # No construye nada: publica el artefacto que subio `build`, que es justo el
  # que paso los tests. El formato del tag ya lo valida `build`: si no es
  # vX.Y.Z, `build` falla y esto no llega a correr.
  publish:
    name: Attach to release
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tested artifact
        uses: actions/download-artifact@v4
        with:
          name: connector-pyz
          path: dist

      # El .pyz y su checksum se suben juntos y de la misma construccion: el
      # participante se descarga un ejecutable y lo corre, y lo unico que tiene
      # para comprobar que es el que publicamos es ese SHA-256.
      - name: Verify checksum
        run: cd dist && sha256sum -c connector.pyz.sha256

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" \
            dist/connector.pyz \
            dist/connector.pyz.sha256 \
            --clobber --repo "$GITHUB_REPOSITORY"
